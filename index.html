<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mom's 50th Birthday Dining Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --surface: #ffffff;
      --bg-body: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; background-color: var(--bg-body); color: var(--text-main); }
    @media (min-width: 768px) { body { flex-direction: row; } }

    #sidebar { width: 100%; height: 55vh; background: var(--surface); display: flex; flex-direction: column; z-index: 1000; border-right: 1px solid var(--border); box-shadow: var(--shadow-lg); }
    @media (min-width: 768px) { #sidebar { width: 440px; height: 100%; } }

    .header { padding: 18px 20px; background: #0b0f19; color: white; }
    .header h1 { font-size: 1.15rem; font-weight: 800; }
    .header-sub { font-size: 0.775rem; color: #94a3b8; margin-top: 4px; }
    .meta-badges { display: flex; gap: 6px; margin-top: 10px; }
    .meta-badge { background: rgba(255, 255, 255, 0.12); color: #cbd5e1; font-size: 0.675rem; font-weight: 600; padding: 3px 8px; border-radius: 9999px; }

    .filter-panel { padding: 14px 20px; background: #f1f5f9; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; }
    .filter-row { display: flex; gap: 8px; }
    .filter-group { flex: 1; display: flex; flex-direction: column; gap: 4px; }
    .filter-label { font-size: 0.675rem; font-weight: 700; text-transform: uppercase; color: var(--text-muted); }
    select, input[type="range"] { width: 100%; padding: 7px 10px; font-size: 0.775rem; font-weight: 600; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text-main); outline: none; cursor: pointer; }
    .range-val { font-size: 0.75rem; font-weight: 700; color: var(--primary); }

    .location-list { flex: 1; overflow-y: auto; padding: 16px; background: var(--bg-body); }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s ease; }
    .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
    .card.active { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2); }
    .card-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .card-title { font-size: 1rem; font-weight: 700; }
    .rating-badge { background: #fef3c7; color: #92400e; font-size: 0.75rem; font-weight: 800; padding: 3px 8px; border-radius: 9999px; }

    .tag-container { display: flex; gap: 6px; margin-bottom: 8px; flex-wrap: wrap; }
    .dist-tag { font-size: 0.7rem; color: #166534; background: #dcfce7; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
    .price-tag { font-size: 0.7rem; color: #431407; background: #fee2e2; font-weight: 700; padding: 2px 7px; border-radius: 6px; }
    .cuisine-tag { font-size: 0.7rem; color: var(--primary); background: #eff6ff; font-weight: 700; padding: 2px 7px; border-radius: 6px; text-transform: uppercase; }
    .buffet-tag { font-size: 0.7rem; color: #7c2d12; background: #ffedd5; font-weight: 700; padding: 2px 7px; border-radius: 6px; }

    .card-address { font-size: 0.775rem; color: var(--text-muted); margin-bottom: 8px; }
    .foodie-highlight { font-size: 0.775rem; color: #065f46; background: #f0fdf4; border-left: 3px solid #16a34a; padding: 6px 10px; border-radius: 0 6px 6px 0; margin-bottom: 12px; }
    .btn-group { display: flex; gap: 8px; }
    .action-btn { flex: 1; text-align: center; padding: 8px 4px; font-size: 0.75rem; font-weight: 700; border-radius: 8px; text-decoration: none; display: flex; align-items: center; justify-content: center; }
    .btn-nav { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f5f9; color: var(--text-main); border: 1px solid var(--border); }

    #map { flex: 1; height: 45vh; }
    @media (min-width: 768px) { #map { height: 100%; } }

    .custom-pin { background-color: var(--primary); color: white; border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: 800; border: 2px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .home-pin { background-color: #ef4444; color: white; border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; border: 2.5px solid white; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4); }
  </style>
</head>
<body>
  <div id="sidebar">
    <div class="header">
      <h1>Mom's 50th Birthday Map</h1>
      <div class="header-sub">📍 Origin: 3255 S Dorsey Ln, Tempe</div>
      <div class="meta-badges">
        <span class="meta-badge">🚫 No Beef / Pork</span>
        <span class="meta-badge">💰 Cap: $30/person</span>
        <span class="meta-badge">❄️ Indoor A/C</span>
      </div>
    </div>

    <div class="filter-panel">
      <div class="filter-row">
        <div class="filter-group">
          <label class="filter-label">Max Price Limit (Category & Below)</label>
          <select id="filter-price">
            <option value="all">Any Price Level</option>
            <option value="2" selected>$$ ($30/person & under)</option>
            <option value="1">$ ($15/person & under)</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Style</label>
          <select id="filter-style">
            <option value="all">All Styles</option>
            <option value="buffet">Buffet / AYCE Only</option>
            <option value="sitdown">Sit-Down / Family Style</option>
          </select>
        </div>
      </div>

      <div class="filter-row" style="align-items: center; margin-top: 2px;">
        <div class="filter-group">
          <label class="filter-label">Max Radius: <span id="radius-val" class="range-val">30 mi</span></label>
          <input type="range" id="filter-radius" min="2" max="30" value="30">
        </div>
        <div class="filter-group">
          <label class="filter-label">Cuisine</label>
          <select id="filter-cuisine">
            <option value="all">All Cuisines</option>
            <option value="Indian">Indian</option>
            <option value="Japanese">Japanese</option>
            <option value="Thai">Thai</option>
            <option value="Mexican">Mexican / Fusion</option>
          </select>
        </div>
      </div>
    </div>

    <div class="location-list" id="location-list"></div>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
