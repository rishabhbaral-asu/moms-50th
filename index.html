<!DOCTYPE html>
<html lang="en">
<head>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --surface: #ffffff;
      --bg-body: #f8fafc;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #16a34a;
      --warning: #d97706;
      --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-body);
      color: var(--text-main);
    }

    @media (min-width: 768px) {
      body { flex-direction: row; }
    }

    /* Professional Sidebar Styling (Apple Maps / Modern Google Maps Floating Panel) */
    #sidebar {
      width: 100%;
      height: 55vh;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      z-index: 1000;
      border-right: 1px solid var(--border);
      box-shadow: var(--shadow-lg);
    }

    @media (min-width: 768px) {
      #sidebar {
        width: 440px;
        height: 100%;
      }
    }

    .header {
      padding: 20px 20px 16px 20px;
      background: #0b0f19;
      color: white;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.15rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .header-sub {
      font-size: 0.775rem;
      color: #94a3b8;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .meta-badges {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .meta-badge {
      background: rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 0.675rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 9999px;
      backdrop-filter: blur(4px);
    }

    /* Filter Panel Styling */
    .filter-panel {
      padding: 14px 20px;
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .filter-row {
      display: flex;
      gap: 8px;
    }

    .filter-group {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .filter-label {
      font-size: 0.675rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    select, input[type="range"] {
      width: 100%;
      padding: 7px 10px;
      font-size: 0.775rem;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    select:focus {
      border-color: var(--primary);
    }

    .range-val {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--primary);
    }

    /* Location List */
    .location-list {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg-body);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-lg);
      border-color: #cbd5e1;
    }

    .card.active {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2), var(--shadow-lg);
      background: #ffffff;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 6px;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
    }

    .rating-badge {
      background: #fef3c7;
      color: #92400e;
      font-size: 0.75rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .tag-container {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .dist-tag {
      font-size: 0.7rem;
      color: #166534;
      background: #dcfce7;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .cuisine-tag {
      font-size: 0.7rem;
      color: var(--primary);
      background: #eff6ff;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .buffet-tag {
      font-size: 0.7rem;
      color: #7c2d12;
      background: #ffedd5;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
    }

    .card-address {
      font-size: 0.775rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .foodie-highlight {
      font-size: 0.775rem;
      color: #065f46;
      background: #f0fdf4;
      border-left: 3px solid #16a34a;
      padding: 6px 10px;
      border-radius: 0 6px 6px 0;
      margin-bottom: 12px;
    }

    /* Clean Button Bar (Apple Maps Style) */
    .btn-group {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 8px;
      text-decoration: none;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .btn-nav {
      background: var(--primary);
      color: white;
    }

    .btn-nav:hover {
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #f1f5f9;
      color: var(--text-main);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    /* Map Display */
    #map {
      flex: 1;
      height: 45vh;
    }

    @media (min-width: 768px) {
      #map { height: 100%; }
    }

    /* Custom Apple-Style Pins */
    .custom-pin {
      background-color: var(--primary);
      color: white;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 800;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .home-pin {
      background-color: #ef4444;
      color: white;
      border-radius: 50%;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      border: 2.5px solid white;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
    }
  </style>
</head>

            <option value="Thai">Thai</option>
            <option value="Mexican">Mexican / Fusion</option>
          </select>
        </div>
      </div>

      <div class="filter-row" style="align-items: center; margin-top: 2px;">
        <div class="filter-group">
          <label class="filter-label">Max Radius: <span id="radius-val" class="range-val">30 mi</span></label>
          <input type="range" id="filter-radius" min="2" max="30" value="30" oninput="updateRadiusLabel(this.value)" onchange="applyFilters()">
        </div>
        <div class="filter-group">
          <label class="filter-label">Max Price</label>
          <select id="filter-price" onchange="applyFilters()">
            <option value="all">Any Price</option>
            <option value="$">$ (Under $20)</option>
            <option value="$$">$$ ($20 - $35)</option>
            <option value="$$$">$$$ ($35+)</option>
          </select>
        </div>
      </div>
    </div>

    <div class="location-list" id="location-list"></div>
  </div>

  <!-- Map Display -->
  <div id="map"></div>

    // Initialize Map with Custom CartoDB Voyager Tiles (Google/Apple Maps look)
    const map = L.map('map').setView([33.4800, -111.9500], 10);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap &copy; CARTO'
    }).addTo(map);

    // Render Origin Home Marker
    const homeIcon = L.divIcon({
      className: 'home-pin',
      html: `<span>🏠</span>`,
      iconSize: [34, 34],
      iconAnchor: [17, 34]
    });
    L.marker([startLat, startLng], { icon: homeIcon }).addTo(map)
      .bindPopup(`<b>🏠 Start Point: 3255 S Dorsey Ln</b>`);

    let activeMarkers = [];

    function updateRadiusLabel(val) {
      document.getElementById('radius-val').innerText = `${val} mi`;
    }

    function applyFilters() {
      const selectedStyle = document.getElementById('filter-style').value;
      const selectedCuisine = document.getElementById('filter-cuisine').value;
      const selectedRadius = parseFloat(document.getElementById('filter-radius').value);
      const selectedPrice = document.getElementById('filter-price').value;

      // Filter array
      const filtered = locations.filter(loc => {
        // Style Filter
        if (selectedStyle === 'buffet' && !loc.isBuffet) return false;
        if (selectedStyle === 'sitdown' && loc.isBuffet) return false;

        // Cuisine Filter
        if (selectedCuisine !== 'all' && loc.cuisine !== selectedCuisine) return false;

        // Radius Filter
        if (loc.distMiles > selectedRadius) return false;

        // Price Filter
        if (selectedPrice !== 'all' && loc.price !== selectedPrice) return false;

        return true;
      });

      renderListAndMap(filtered);
    }

    function renderListAndMap(dataset) {
      // Clear existing map markers
      activeMarkers.forEach(m => map.removeLayer(m));
      activeMarkers = [];

      const container = document.getElementById('location-list');
      container.innerHTML = '';

      if (dataset.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 40px 20px; color: #64748b;">
          <b>No places match these filters.</b><br><span style="font-size:0.8rem;">Try expanding your max distance or price option.</span>
        </div>`;
        return;
      }

      dataset.forEach((loc, idx) => {
        // Map Marker
        const pinIcon = L.divIcon({
          className: 'custom-pin',
          html: `<span>${idx + 1}</span>`,
          iconSize: [30, 30],
          iconAnchor: [15, 30]
        });

        const marker = L.marker([loc.lat, loc.lng], { icon: pinIcon }).addTo(map);

        const popupHTML = `
          <div style="font-family: sans-serif; width: 220px;">
            <h3 style="margin-bottom: 2px; color: #0f172a; font-size: 0.95rem;">${loc.name}</h3>
            <p style="font-size: 0.75rem; color: #166534; font-weight: bold; margin-bottom: 2px;">🚘 ${loc.distMiles} mi (${loc.driveTime})</p>
            <p style="font-size: 0.75rem; color: #b45309; font-weight: bold;">${loc.rating}</p>
            <p style="font-size: 0.75rem; color: #065f46; margin: 4px 0;"><b>Highlights:</b> ${loc.dishes}</p>
            <div style="margin-top: 8px; display: flex; gap: 4px;">
              <a href="${loc.navUrl}" target="_blank" style="background: #2563eb; color: white; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; text-decoration: none; font-weight: bold;">🚗 Route</a>
              <a href="${loc.menuUrl}" target="_blank" style="background: #f1f5f9; color: #0f172a; padding: 4px 8px; font-size: 0.7rem; border-radius: 4px; text-decoration: none; font-weight: bold;">📖 Menu</a>
            </div>
          </div>
        `;
        marker.bindPopup(popupHTML);
        activeMarkers.push(marker);

        // Sidebar Card
        const card = document.createElement('div');
        card.className = 'card';
        card.id = `card-${loc.id}`;
        card.innerHTML = `
          <div class="card-header-row">
            <div class="card-title">${idx + 1}. ${loc.name}</div>
            <div class="rating-badge">${loc.rating}</div>
          </div>
          <div class="tag-container">
            <span class="dist-tag">🚘 ${loc.distMiles} mi (${loc.driveTime})</span>
            <span class="cuisine-tag">${loc.cuisine} • ${loc.price}</span>
            ${loc.isBuffet ? '<span class="buffet-tag">🍱 AYCE / Buffet</span>' : ''}
          </div>
          <div class="card-address">📍 ${loc.address}</div>
          <div class="foodie-highlight">🍗 <b>Non-Beef/Pork Stars:</b> ${loc.dishes}</div>
          
          <div class="btn-group">
            <a href="${loc.navUrl}" target="_blank" class="action-btn btn-nav" onclick="event.stopPropagation();">🚗 Route from Home</a>
            <a href="${loc.menuUrl}" target="_blank" class="action-btn btn-secondary" onclick="event.stopPropagation();">📖 Menu</a>
            <a href="${loc.googleMapUrl}" target="_blank" class="action-btn btn-secondary" onclick="event.stopPropagation();">⭐ Reviews</a>
          </div>
        `;

        card.addEventListener('click', () => {
          map.flyTo([loc.lat, loc.lng], 13, { duration: 1.2 });
          marker.openPopup();
          document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
        });

        container.appendChild(card);
      });
    }

    // Initial Render
    applyFilters();
  </script>
</body>
</html>
