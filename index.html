<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS for Map Styling -->

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background-color: #f4f5f7;
    }

    @media (min-width: 768px) {
      body { flex-direction: row; }
    }

    /* Sidebar Styling */
    #sidebar {
      width: 100%;
      height: 50vh;
      background: #ffffff;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.1);
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    @media (min-width: 768px) {
      #sidebar {
        width: 450px;
        height: 100%;
      }
    }

    .header {
      padding: 16px 20px;
      background: #111827;
      color: white;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
      margin-bottom: 2px;
    }

    .header p {
      font-size: 0.775rem;
      color: #9ca3af;
    }

    .badge-container {
      display: flex;
      gap: 6px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .badge {
      background: #374151;
      color: #e5e7eb;
      font-size: 0.7rem;
      padding: 3px 6px;
      border-radius: 4px;
      font-weight: 500;
    }

    .location-list {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .card:hover, .card.active {
      border-color: #2563eb;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
      background: #f8fafc;
    }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 4px;
    }

    .card-title {
      font-size: 0.975rem;
      font-weight: 700;
      color: #1f2937;
    }

    .rating-badge {
      background: #fef3c7;
      color: #b45309;
      font-size: 0.725rem;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .distance-tag {
      display: inline-block;
      font-size: 0.725rem;
      color: #15803d;
      background: #dcfce7;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .cuisine-tag {
      font-size: 0.75rem;
      color: #2563eb;
      font-weight: 600;
      margin-left: 6px;
      text-transform: uppercase;
    }

    .card-detail {
      font-size: 0.8rem;
      color: #4b5563;
      margin-bottom: 6px;
    }

    .card-highlights {
      font-size: 0.775rem;
      color: #065f46;
      background: #ecfdf5;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 6px;
    }

    /* Action Links Bar */
    .btn-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      text-align: center;
      padding: 6px 4px;
      font-size: 0.725rem;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s;
    }

    .btn-nav {
      background: #16a34a;
      color: white;
    }

    .btn-nav:hover {
      background: #15803d;
    }

    .btn-menu {
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .btn-reviews {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    /* Map Styling */
    #map {
      flex: 1;
      height: 50vh;
    }

    @media (min-width: 768px) {
      #map { height: 100%; }
    }

    .custom-marker {
      background-color: #2563eb;
      color: white;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .start-marker {
      background-color: #dc2626;
      color: white;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      border: 2px solid white;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>

      });

        </div>

          <a href="${loc.googleMapUrl}" target="_blank" class="action-btn btn-reviews" onclick="event.stopPropagation();">⭐ Reviews</a>
        </div>
      `;

      card.addEventListener('click', () => {
        map.flyTo([loc.lat, loc.lng], 13, { duration: 1.2 });
        marker.openPopup();
        document.querySelectorAll('.card').forEach(c => c.classList.remove('active'));
        card.classList.add('active');
      });

</html>
